<style>
/* Layout: one calm column; tab bar on top, practice takes over the column; keyboard-first on desktop, thumb-sized on phone */
:root{
  --bg:#EDEFED; --surface:#F8F9F7; --ink:#1F2629; --muted:#66706F; --line:#D6DBD7;
  --sea:#3F6670; --sea-soft:#DCE6E6; --err:#A5503F; --err-soft:#F2E3DE; --ok:#4E7A5A; --ok-soft:#E1ECE3; --star:#B07F2E;
  --f-en:"Newsreader",Georgia,"Times New Roman",serif;
  --f-zh:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141A1C; --surface:#1C2427; --ink:#E3E8E6; --muted:#93A09E; --line:#2D383B;
  --sea:#8DB3BC; --sea-soft:#22363A; --err:#DE8F7B; --err-soft:#3A2622; --ok:#8DBB97; --ok-soft:#1F3226; --star:#D9AE62; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141A1C; --surface:#1C2427; --ink:#E3E8E6; --muted:#93A09E; --line:#2D383B;
  --sea:#8DB3BC; --sea-soft:#22363A; --err:#DE8F7B; --err-soft:#3A2622; --ok:#8DBB97; --ok-soft:#1F3226; --star:#D9AE62; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-zh);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.02em}
.brand small{font-family:var(--f-en);font-style:italic;color:var(--muted);font-size:14px}
nav.tabs{display:flex;gap:2px;margin-top:10px;overflow-x:auto}
nav.tabs button{background:none;border:0;padding:8px 12px 10px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--sea)}
main{padding-top:22px;display:grid;gap:22px}
h2{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.08em;margin:0 0 10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{background:var(--surface);padding:14px 12px}
.stat b{display:block;font-family:var(--f-en);font-size:28px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
@media (max-width:560px){.stats{grid-template-columns:repeat(3,1fr)}.stat b{font-size:24px}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:grid;gap:8px;margin-bottom:16px}
.field>label,.field>.lab{font-size:13px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{background:var(--surface);border:0;border-right:1px solid var(--line);padding:7px 14px;min-height:38px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--sea);color:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:6px;min-width:44px;padding:5px 8px;font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:13px}
.chip[aria-pressed="true"]{background:var(--sea-soft);border-color:var(--sea);color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;min-height:40px}
.btn.primary{background:var(--sea);border-color:var(--sea);color:var(--surface);font-weight:600}
.btn.warn{color:var(--err);border-color:var(--err)}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;color:var(--sea);padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.muted{color:var(--muted)}
.small{font-size:13px}
.due{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.due p{margin:0}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted);background:var(--bg)}
/* practice */
.pbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.track{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:10px}
.track i{display:block;height:100%;background:var(--sea);transition:width .2s}
.tag{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:1px 7px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 22px;display:grid;gap:18px;text-align:center}
.prompt-zh{font-size:28px;font-weight:600;line-height:1.35}
.pattern{font-family:var(--f-mono);letter-spacing:.12em;color:var(--muted);font-size:16px;white-space:pre-wrap;word-break:break-all}
.speak{width:84px;height:84px;border-radius:50%;border:1px solid var(--sea);background:var(--sea-soft);color:var(--sea);display:grid;place-items:center;margin:0 auto}
.speak svg{width:34px;height:34px}
.answer-in{width:100%;font-family:var(--f-mono);font-size:26px;text-align:center;padding:12px;border:0;border-bottom:2px solid var(--line);background:transparent;outline:none;border-radius:0}
.answer-in:focus{border-bottom-color:var(--sea)}
.answer-in.bad{border-bottom-color:var(--err);animation:shake .25s}
.answer-in.good{border-bottom-color:var(--ok);color:var(--ok)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.answer-in.bad{animation:none}.track i{transition:none}}
.fb{min-height:24px;font-size:14px}
.fb.bad{color:var(--err)} .fb.good{color:var(--ok)}
.reveal{display:grid;gap:4px;justify-items:center;padding:14px;border-radius:10px;background:var(--bg)}
.reveal .en{font-family:var(--f-en);font-size:34px;font-weight:600;line-height:1.15}
.reveal .ipa{font-family:var(--f-en);color:var(--muted);font-size:17px}
.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.keys{font-size:12px;color:var(--muted);text-align:center}
.star{background:none;border:1px solid var(--line);border-radius:8px;min-height:40px;padding:6px 12px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.star[aria-pressed="true"]{color:var(--star);border-color:var(--star)}
.star svg{width:16px;height:16px}
.icon-btn{background:none;border:1px solid var(--line);border-radius:8px;width:34px;height:34px;display:inline-grid;place-items:center;color:var(--sea);flex:none}
.icon-btn svg{width:16px;height:16px}
.icon-btn.on{color:var(--star);border-color:var(--star)}
/* lists */
.list{display:grid;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .w{min-width:0}
.item .en{font-family:var(--f-en);font-size:19px;font-weight:600}
.item .ipa{font-family:var(--f-en);color:var(--muted);font-size:14px;margin-left:6px}
.item .zh{font-size:14px}
.item .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.item .ops{display:flex;gap:6px;align-items:center}
.pill{font-size:11px;border-radius:999px;padding:1px 8px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.learning{border-color:var(--sea);color:var(--sea)}
.pill.mastered{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.pill.bad{border-color:var(--err);color:var(--err)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input,.toolbar select,.form input,select.sel{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-height:40px;min-width:0}
.toolbar input{flex:1 1 180px}
.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.form{grid-template-columns:1fr 1fr}}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:10px;font-family:var(--f-mono);font-size:12px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.bars{display:grid;gap:6px}
.bars .r{display:grid;grid-template-columns:52px 1fr 92px;gap:10px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.bars .b{height:10px;background:var(--line);border-radius:3px;overflow:hidden}
.bars .b i{display:block;height:100%;background:var(--sea)}
.notice{border-left:3px solid var(--err);background:var(--err-soft);padding:10px 14px;border-radius:6px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:90vw}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.sum div{background:var(--surface);padding:14px;text-align:center}
.sum b{display:block;font-family:var(--f-en);font-size:30px;font-variant-numeric:tabular-nums}
.sum span{font-size:12px;color:var(--muted)}
p{margin:0 0 8px}
</style>

const VARIANT={colour:["color"],grey:["gray"],favourite:["favorite"],centre:["center"],neighbour:["neighbor"],programme:["program"],theatre:["theater"],metre:["meter"],cheque:["check"],aeroplane:["airplane"],"mr.":["mr"],"mrs.":["mrs"],"hard-working":["hardworking","hard working"],"o'clock":["oclock"]};

/* ---------- storage ---------- */
function blank(){return{app:"nce-dictation",v:1,custom:[],prog:{},book:{},days:{},settings:{accent:"US",rate:1,voice:"",count:10,order:"seq",mode:"L",filter:"all",lessons:[1]}}}
let db=blank(), canSave=true;
try{const s=localStorage.getItem(KEY); if(s){const o=JSON.parse(s); if(o&&o.v===1){db=Object.assign(blank(),o);db.settings=Object.assign(blank().settings,o.settings||{});}}}catch(e){canSave=false}

/* ---------- dates (local) ---------- */
function ds(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function today(){return ds(new Date())}
function addDays(s,n){const [y,m,d]=s.split("-").map(Number);return ds(new Date(y,m-1,d+n))}

/* ---------- word list ---------- */
let W=new Map();
function norm(s){return String(s).trim().toLowerCase().replace(/[‘’]/g,"'").replace(/\s+/g," ")}
function buildWords(){
  W=new Map();
  const put=(lesson,en,zh,ipa,custom)=>{
    const k=norm(en); if(!k) return;
    let w=W.get(k);
    if(!w){w={key:k,en:en.trim(),zh:[],ipa:ipa||"",lessons:[],custom:!!custom};W.set(k,w)}
    if(zh && !w.zh.includes(zh)) w.zh.push(zh);
    if(lesson && !w.lessons.includes(lesson)) w.lessons.push(lesson);
    if(!w.ipa && ipa) w.ipa=ipa;
    if(custom) w.custom=true;
  };
  RAW.forEach(r=>put(r[0],r[1],r[2],r[3],false));
  db.custom.forEach(r=>put(r.lesson||0,r.en,r.zh,r.ipa,true));
  W.forEach(w=>w.lessons.sort((a,b)=>a-b));
}
buildWords();
function zhOf(w){return w.zh.join("；")}
function answers(w){const k=w.key;return [k,...(VARIANT[k]||[])].map(norm)}
function lessonsAll(){const s=new Set();W.forEach(w=>w.lessons.forEach(l=>s.add(l)));return [...s].sort((a,b)=>a-b)}
function lessonName(n){return n===0?"未分课":"Lesson "+n+(LT[n]?" · "+LT[n]:"")}

/* ---------- progress ---------- */
function P(k,m){db.prog[k]=db.prog[k]||{};return db.prog[k][m]=db.prog[k][m]||{s:0,due:null,n:0,ok1:0,wrong:0,hint:0,rev:0,last:null}}
function peek(k,m){return db.prog[k]&&db.prog[k][m]}
function status(k){const L=peek(k,"L"),C=peek(k,"C");if(!L&&!C)return"new";if(L&&C&&L.s>=3&&C.s>=3)return"mastered";return"learning"}
const STATUS_ZH={new:"未学",learning:"学习中",mastered:"已掌握"};
function dueItems(){const t=today(),out=[];Object.keys(db.prog).forEach(k=>{if(!W.has(k))return;["L","C"].forEach(m=>{const p=db.prog[k][m];if(p&&p.due&&p.due<=t)out.push({key:k,m})})});return out}
function dayRec(){const t=today();return db.days[t]=db.days[t]||{w:{},att:0,ok1:0}}
function recordOutcome(it,success){
  if(it.retry) return;
  const p=P(it.key,it.m),t=today();
  p.n++;p.last=t;
  if(success){p.ok1++;p.s++;p.due=addDays(t,STEPS[Math.min(p.s,5)-1])}
  else{p.s=0;p.due=addDays(t,1)}
  const d=dayRec();d.w[it.key]=1;d.att++;if(success)d.ok1++;
  save();
}
function wrongTotal(k){const L=peek(k,"L"),C=peek(k,"C");return (L?L.wrong:0)+(C?C.wrong:0)}

/* ---------- speech ---------- */
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()||[]}catch(e){voices=[]}}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=()=>{loadVoices();if(view==="settings")render()}}
function langWant(){return"en-US"}
function isUS(v){return v.lang.replace("_","-").toLowerCase()==="en-us"}
function pickVoice(){
  if(!voices.length) return null;
  if(db.settings.voice){const v=voices.find(v=>v.name===db.settings.voice&&isUS(v));if(v)return v}
  const m=voices.filter(isUS);
  const pref=["Samantha","Ava","Allison","Google US English","Alex","Microsoft Aria","Microsoft Jenny","Microsoft Guy"];
  for(const n of pref){const v=m.find(v=>v.name.includes(n));if(v)return v}
  return m[0]||null;
}
function speak(text){
  if(!("speechSynthesis" in window)){toast("这个浏览器不支持语音播放，请换 Safari 或 Chrome");return}
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    const v=pickVoice(); if(v)u.voice=v;
    u.lang="en-US"; u.rate=db.settings.rate;
    u.onerror=e=>{if(e.error!=="interrupted"&&e.error!=="canceled")toast("发音播放失败，请再点一次")};
    speechSynthesis.speak(u);
  }catch(e){toast("发音播放失败")}
}

function pattern(en,reveal){let first=true;return en.split("").map(c=>{if(/[a-z]/i.test(c)){if(reveal&&first){first=false;return c}first=false;return"_"}return c===" "?" ":c}).join(" ")}

function seg(name,opts,cur){return `<div class="seg" role="group">${opts.map(([v,l])=>`<button data-seg="${name}" data-v="${v}" aria-pressed="${String(cur)===String(v)}">${l}</button>`).join("")}</div>`}
function buildPool(){
  const st=db.settings,sel=new Set(st.lessons);
  let ws=[...W.values()].filter(w=>w.lessons.some(l=>sel.has(l)));
  if(st.filter==="new")ws=ws.filter(w=>status(w.key)==="new");
  if(st.filter==="seen")ws=ws.filter(w=>status(w.key)!=="new");
  ws.sort((a,b)=>Math.min(...a.lessons.filter(l=>sel.has(l)))-Math.min(...b.lessons.filter(l=>sel.has(l))));
  return ws;
}
function pickMode(k,mode){if(mode!=="M")return mode;const L=peek(k,"L"),C=peek(k,"C");const a=L?L.s:-1,b=C?C.s:-1;if(a===b)return Math.random()<.5?"L":"C";return a<b?"L":"C"}
function startSession(items,label,opts={}){

function noVoiceNote(){if(!("speechSynthesis" in window))return"此浏览器不支持语音";if(voices.length&&!pickVoice())return"系统里没有美式语音，见「设置」里的说明";return"点按喇叭或按 Esc 重播"}

  const it=S&&!S.done?cur():null;
  if(a==="play"&&it){
    if(it.m==="C"&&!it.done){ if(!it.hint){it.hint=true;it.heard=true;P(it.key,"C").hint++;if(it.outcome===null){it.outcome=false;recordOutcome(it,false)}it.fb=["","中文默写中听了发音，这题按提示计，不算首次正确"]} save(); render(); }
    speak(W.get(it.key).en);return;
  }
  if(a==="check"&&it)return check();
  if(a==="hint"&&it&&!it.hint){it.hint=true;P(it.key,it.m).hint++;if(it.outcome===null){it.outcome=false;recordOutcome(it,false)}save();it.last=$("#ans").value;render();return}
  if(a==="reveal"&&it&&!it.done){it.rev=true;it.done=true;P(it.key,it.m).rev++;if(it.outcome===null){it.outcome=false;recordOutcome(it,false)}it.last=$("#ans").value;it.fb=["bad",it.wrong?`你写的是「${it.last}」`:"已显示答案，这题按答错计"];save();render();if(it.m==="C")speak(W.get(it.key).en);return}
  if(a==="next"&&it){S.i++;if(S.i>=S.items.length)S.done=true;render();return}

    <div class="row">${[["L","听音默写"],["C","中文默写"],["M","混合"]].map(([m,l])=>`<button class="btn ${m==="L"?"primary":""}" data-bookstart="${m}" ${ks.length?"":"disabled"}>${l}</button>`).join("")}</div></section>
  <section>
    <div class="toolbar"><select class="sel" id="bookLesson" aria-label="按课筛选"><option value="">全部课次</option>${les.map(l=>`<option value="${l}" ${String(l)===ui.bookLesson?"selected":""}>${esc(lessonName(l))}</option>`).join("")}</select></div>
    ${ks.length?`<div class="list">${ks.map(k=>{const w=W.get(k),L=peek(k,"L"),C=peek(k,"C");const n=(L?L.n:0)+(C?C.n:0);
      return `<div class="item"><div class="w"><div><span class="en">${esc(w.en)}</span>${w.ipa?`<span class="ipa">/${esc(w.ipa)}/</span>`:""}</div><div class="zh">${esc(zhOf(w))}</div>
      <div class="meta">${esc(w.lessons.map(l=>l?"L"+l:"自定义").join(" / "))} · 练 ${n} 次 · 错 ${wrongTotal(k)} 次${L?` · 听音连对 ${L.s}`:""}${C?` · 中文连对 ${C.s}`:""}</div></div>
      <div class="ops"><button class="icon-btn" data-say="${esc(k)}" aria-label="播放">${ICON.speak}</button><button class="btn small" data-bk="${esc(k)}">已掌握</button></div></div>`}).join("")}</div>`
    :`<div class="list"><div class="empty">练习册还是空的。默写时点「加入练习册」，或在词库里点星标。</div></div>`}
  </section>`;
}

/* ---------- 词库 ---------- */
function vWords(){
  let ws=[...W.values()];
  const q=norm(ui.q);
  if(q)ws=ws.filter(w=>w.key.includes(q)||zhOf(w).includes(ui.q.trim()));
  if(ui.lesson!=="")ws=ws.filter(w=>w.lessons.includes(+ui.lesson));
  if(ui.st!=="all")ws=ws.filter(w=>status(w.key)===ui.st);
  ws.sort((a,b)=>a.lessons[0]-b.lessons[0]);
  const shown=ws.slice(0,200);
  return `<section>
    <div class="toolbar"><input id="q" type="search" placeholder="搜英文或中文" value="${esc(ui.q)}" aria-label="搜索">
      <select class="sel" id="fl" aria-label="课次"><option value="">全部课次</option>${lessonsAll().map(l=>`<option value="${l}" ${String(l)===ui.lesson?"selected":""}>${esc(lessonName(l))}</option>`).join("")}</select>
      <select class="sel" id="fs" aria-label="状态">${[["all","全部状态"],["new","未学"],["learning","学习中"],["mastered","已掌握"]].map(([v,l])=>`<option value="${v}" ${ui.st===v?"selected":""}>${l}</option>`).join("")}</select></div>
    <p class="muted small">共 ${ws.length} 个${ws.length>200?"，只显示前 200 个，可以搜索或选课缩小范围":""}。已掌握 = 听音、中文两种方式都连续 3 次首次答对。</p>
    <div class="list">${shown.length?shown.map(w=>wordRow(w,w.custom?"自定义":"")).join(""):`<div class="empty">没有符合条件的单词</div>`}</div>
  </section>
  <section class="panel"><h2>添加单词</h2>
    <div class="form"><input id="nEn" placeholder="英文" aria-label="英文"><input id="nZh" placeholder="中文释义" aria-label="中文"><input id="nL" inputmode="numeric" placeholder="课次，如 73" aria-label="课次"><input id="nIpa" placeholder="音标（可空）" aria-label="音标"></div>
    <div class="row" style="margin-top:10px"><button class="btn primary" data-act="add-word">添加</button><span class="muted small">同一个英文在多课出现会合并成一个词，课次和释义会叠加。</span></div>
  </section>
  <section class="panel"><h2>批量导入 CSV</h2>
    <p class="small">每行一个词，顺序是 <code>英文,中文,课次,音标</code>，音标可以不填。中文里有逗号时用中文逗号，或用英文双引号把整格括起来。</p>
    <textarea id="csv" spellcheck="false" placeholder="supermarket,超市,73,ˈsuːpɚˌmɑːrkɪt&#10;stay,停留,73,&#10;&quot;bus stop&quot;,公共汽车站,73,"></textarea>
    <div class="row" style="margin-top:10px"><button class="btn primary" data-act="csv">导入</button><label class="btn" for="csvFile">选择 CSV 文件</label><input type="file" id="csvFile" accept=".csv,.txt,text/csv" hidden></div>
  </section>
  ${db.custom.length?`<section class="panel"><h2>自定义单词 · ${db.custom.length}</h2><div class="list">${db.custom.map((r,i)=>`<div class="item"><div class="w"><span class="en">${esc(r.en)}</span> <span class="small">${esc(r.zh)}</span> <span class="meta">${r.lesson?"L"+r.lesson:""}</span></div><div class="ops"><button class="btn small warn" data-delc="${i}">删除</button></div></div>`).join("")}</div></section>`:""}`;
}
function parseCSV(text){
  const rows=[];text.replace(/\r/g,"").split("\n").forEach(line=>{if(!line.trim())return;const out=[];let f="",q=false;for(let i=0;i<line.length;i++){const c=line[i];if(q){if(c==='"'&&line[i+1]==='"'){f+='"';i++}else if(c==='"')q=false;else f+=c}else{if(c==='"')q=true;else if(c===","){out.push(f);f=""}else f+=c}}out.push(f);rows.push(out.map(s=>s.trim()))});
  return rows;
}
function importRows(rows){
  let ok=0,skip=0;
  rows.forEach(r=>{const [en,zh,l,ipa]=r;if(!en||!zh||/^英文$|^english$/i.test(en)){skip++;return}const lesson=parseInt(l,10)||0;if(db.custom.some(c=>norm(c.en)===norm(en)&&c.lesson===lesson&&c.zh===zh)){skip++;return}db.custom.push({en,zh,lesson,ipa:ipa||""});ok++});
  save();buildWords();render();toast(`导入 ${ok} 个${skip?`，跳过 ${skip} 行`:""}`);
}

/* ---------- 统计 ---------- */
function vStats(){
  const days=[];for(let i=13;i>=0;i--){const k=addDays(today(),-i);days.push([k,db.days[k]])}
  const max=Math.max(1,...days.map(d=>d[1]?d[1].att:0));
  const ks=[...W.keys()];
  const cnt=m=>ks.filter(k=>{const p=peek(k,m);return p&&p.s>=3}).length;
  const top=ks.filter(k=>wrongTotal(k)>0).sort((a,b)=>wrongTotal(b)-wrongTotal(a)).slice(0,15);
  const totalAtt=Object.values(db.days).reduce((s,d)=>s+d.att,0),totalOk=Object.values(db.days).reduce((s,d)=>s+d.ok1,0);
  return `<section class="stats" style="grid-template-columns:repeat(4,1fr)">
    <div class="stat"><b>${ks.filter(k=>status(k)!=="new").length}</b><span>练过的词</span></div>
    <div class="stat"><b>${cnt("L")}</b><span>听音已稳</span></div>
    <div class="stat"><b>${cnt("C")}</b><span>中文已稳</span></div>
    <div class="stat"><b>${totalAtt?Math.round(totalOk/totalAtt*100)+"%":"—"}</b><span>累计首次正确率</span></div></section>
  <p class="muted small">「已稳」= 该方式连续 3 次首次答对（下次复习在 7 天以后）。两种都稳才算已掌握。</p>
  <section class="panel"><h2>最近 14 天</h2><div class="bars">${days.map(([k,d])=>`<div class="r"><span class="muted">${k.slice(5)}</span><div class="b"><i style="width:${d?d.att/max*100:0}%"></i></div><span>${d?`${d.att} 题 · ${Math.round(d.ok1/d.att*100)}%`:"—"}</span></div>`).join("")}</div></section>
  <section><h2>错得最多的词</h2>${top.length?`<div class="list">${top.map(k=>wordRow(W.get(k),`累计错 ${wrongTotal(k)} 次`)).join("")}</div>`:`<div class="list"><div class="empty">还没有错词记录</div></div>`}</section>`;
}

/* ---------- 设置与备份 ---------- */
function vSettings(){
  const st=db.settings;
  const vs=voices.filter(isUS);
  const auto=pickVoice();
  const framed=(()=>{try{return window.top!==window.self}catch(e){return true}})();
  return `<section class="panel"><h2>发音</h2>
    <p class="small">只用美式英语（en-US）声音朗读，音标也是美式。</p>
    <div class="field"><div class="lab">语速</div>${seg("rate",[[0.75,"0.75×"],[1,"正常"],[1.25,"1.25×"]],st.rate)}</div>
    <div class="field"><label for="voice">声音</label>
      <select class="sel" id="voice"><option value="">自动（${auto?esc(auto.name):"系统默认"}）</option>${vs.map(v=>`<option value="${esc(v.name)}" ${st.voice===v.name?"selected":""}>${esc(v.name)}</option>`).join("")}</select>
      ${!("speechSynthesis" in window)?`<div class="notice">这个浏览器不支持语音合成，听音默写无法使用。</div>`:(voices.length&&!vs.length?`<div class="notice">这台设备没有美式英语声音，读出来可能是英式或其他口音。iPhone：设置 › 辅助功能 › 朗读内容 › 声音 › 英语，下载「美国」下的 Samantha 或 Ava（增强版）。电脑用 Chrome 会自带 Google US English。</div>`:"")}
    </div>
    <div class="row"><button class="btn" data-act="test-voice">试听 handbag</button><button class="btn" data-act="test-voice2">试听 Excuse me</button></div>
  </section>
  <section class="panel"><h2>备份</h2>
    <p class="small">记录只存在当前这个浏览器里。换手机、换浏览器或清理网站数据之前，先复制备份，存到备忘录或微信文件传输助手。</p>
    <div class="row"><button class="btn primary" data-act="export">生成备份</button>${ui.exportText?`<button class="btn" data-act="copy-export">复制</button>${framed?"":`<button class="btn" data-act="dl-export">下载文件</button>`}`:""}</div>
    ${ui.exportText?`<textarea id="exp" readonly style="margin-top:10px">${esc(ui.exportText)}</textarea>`:""}
    <h2 style="margin-top:20px">恢复</h2>
    <textarea id="imp" spellcheck="false" placeholder="把备份内容粘贴到这里，或选择备份文件">${esc(ui.importText)}</textarea>
    <div class="row" style="margin-top:10px">
      ${ui.confirm==="import"?`<button class="btn warn" data-act="import-yes">确认覆盖当前记录</button><button class="btn" data-act="cancel">取消</button>`:`<button class="btn primary" data-act="import">恢复备份</button><label class="btn" for="impFile">选择备份文件</label><input type="file" id="impFile" accept=".json,application/json,.txt" hidden>`}
    </div>
  </section>
  <section class="panel"><h2>清空</h2>
    <p class="small muted">删除所有练习记录、练习册和自定义单词。建议先生成备份。</p>
    ${ui.confirm==="reset"?`<div class="row"><button class="btn warn" data-act="reset-yes">确认清空，无法撤销</button><button class="btn" data-act="cancel">取消</button></div>`:`<button class="btn warn" data-act="reset">清空全部记录</button>`}
  </section>
  <p class="muted small">词库：L1–L71 共 ${RAW.length} 条，来自你的「新概念一册跟读」，含课文生词和练习补充词，不是完整教材词表；L73 以后需要按教材用 CSV 导入。</p>`;
}
function validBackup(o){return o&&o.app==="nce-dictation"&&o.v===1&&o.prog&&typeof o.prog==="object"&&o.book&&typeof o.book==="object"&&Array.isArray(o.custom)&&o.days&&typeof o.days==="object"}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  const d=t.dataset,st=db.settings;
  if(d.seg){let v=d.v;if(d.seg==="count")v=v==="all"?"all":+v;if(d.seg==="rate")v=+v;st[d.seg]=v;save();render();if(d.seg==="rate")speak("handbag");return}
  if(d.les!==undefined){const l=+d.les,s=new Set(st.lessons);s.has(l)?s.delete(l):s.add(l);st.lessons=[...s].sort((a,b)=>a-b);save();render();return}
  if(d.say){speak(W.get(d.say).en);return}
  if(d.bk){toggleBook(d.bk);render();return}
  if(d.bookstart){const ks=Object.keys(db.book).filter(k=>W.has(k)&&(ui.bookLesson===""||W.get(k).lessons.includes(+ui.bookLesson)));startSession(shuffle(ks.map(k=>({key:k,m:pickMode(k,d.bookstart)}))),"练习册");return}
  if(d.delc!==undefined){db.custom.splice(+d.delc,1);save();buildWords();render();return}
  const a=d.act;if(!a)return;
  if(S&&["play","check","hint","reveal","next","book","quit"].includes(a))return act(a);
  switch(a){
    case"les-all":st.lessons=lessonsAll();save();render();break;
    case"les-none":st.lessons=[];save();render();break;
    case"start-new":{let ws=buildPool();if(st.order==="rand")shuffle(ws);if(st.count!=="all")ws=ws.slice(0,st.count);
      const lab=st.lessons.length===1?"Lesson "+st.lessons[0]:st.lessons.length+" 课";startSession(ws.map(w=>({key:w.key,m:pickMode(w.key,st.mode)})),lab);break}
    case"start-due":startSession(shuffle(dueItems()),"今日复习");break;
    case"retry":{const bad=S.items.filter(x=>x.outcome===false).map(x=>({key:x.key,m:x.m}));startSession(shuffle(bad),"错词重练",{retry:true});break}
    case"home":S=null;view="today";render();break;
    case"book-all-bad":S.items.filter(x=>x.outcome===false).forEach(x=>{if(!db.book[x.key])db.book[x.key]=Date.now()});save();render();toast("已加入练习册");break;
    case"add-word":{const en=$("#nEn").value.trim(),zh=$("#nZh").value.trim();if(!en||!zh){toast("英文和中文都要填");return}db.custom.push({en,zh,lesson:parseInt($("#nL").value,10)||0,ipa:$("#nIpa").value.trim()});save();buildWords();render();toast("已添加 "+en);break}
    case"csv":importRows(parseCSV($("#csv").value));break;
    case"test-voice":speak("handbag");break;
    case"test-voice2":speak("Excuse me");break;
    case"export":ui.exportText=JSON.stringify(Object.assign({exportedAt:new Date().toISOString()},db));render();break;
    case"copy-export":{const done=()=>toast("备份已复制");try{navigator.clipboard.writeText(ui.exportText).then(done,()=>{$("#exp").select();toast("请手动全选复制")})}catch(e){$("#exp").select();toast("请手动全选复制")}break}
    case"dl-export":{const b=new Blob([ui.exportText],{type:"application/json"}),u=URL.createObjectURL(b),l=document.createElement("a");l.href=u;l.download="新概念单词本备份-"+today()+".json";l.click();setTimeout(()=>URL.revokeObjectURL(u),2000);break}
    case"import":{ui.importText=$("#imp").value;let o;try{o=JSON.parse(ui.importText)}catch(e){toast("内容不是有效的备份，请完整粘贴");return}if(!validBackup(o)){toast("这不是新概念单词本的备份，或版本不对");return}ui.confirm="import";render();break}
    case"import-yes":{const o=JSON.parse(ui.importText);db=Object.assign(blank(),o);delete db.exportedAt;db.settings=Object.assign(blank().settings,o.settings||{});save();buildWords();ui.confirm=null;ui.importText="";render();toast("已恢复备份");break}
    case"reset":ui.confirm="reset";render();break;
    case"reset-yes":db=blank();save();buildWords();ui.confirm=null;ui.exportText="";render();toast("已清空");break;
    case"cancel":ui.confirm=null;render();break;
  }
});
document.addEventListener("input",e=>{
  const id=e.target.id;
  if(id==="q"){if(e.isComposing)return;ui.q=e.target.value;const p=e.target.selectionStart;render();const q=$("#q");q.focus();q.setSelectionRange(p,p)}
  if(id==="ans"){const it=S&&cur();if(it&&it.fb&&it.fb[0]==="bad"&&!it.done){e.target.classList.remove("bad");}}
});
document.addEventListener("compositionend",e=>{if(e.target.id==="q")e.target.dispatchEvent(new Event("input",{bubbles:true}))});
document.addEventListener("change",e=>{
  const id=e.target.id;
  if(id==="fl"){ui.lesson=e.target.value;render()}
  if(id==="fs"){ui.st=e.target.value;render()}
  if(id==="bookLesson"){ui.bookLesson=e.target.value;render()}
  if(id==="voice"){db.settings.voice=e.target.value;save();speak("handbag")}
  if(id==="csvFile"||id==="impFile"){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{if(id==="csvFile")importRows(parseCSV(String(r.result)));else{ui.importText=String(r.result);render();toast("文件已读入，点「恢复备份」")}};r.readAsText(f)}
});
document.addEventListener("keydown",e=>{
  if(!S||S.done)return;
  const it=cur();
  if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();if(!it.done)act("reveal");return}
  if(e.key==="Enter"&&e.target.id==="ans"){e.preventDefault();if(e.isComposing)return;it.done?act("next"):check();return}
  if(e.key==="Escape"){e.preventDefault();act("play");return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="b"){e.preventDefault();act("book")}
});
document.addEventListener("keydown",e=>{if(S&&S.done&&e.key==="Enter"&&!e.target.closest("button")){e.preventDefault();S=null;view="today";render()}});
render();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
